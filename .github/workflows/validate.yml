name: validate client files
on:
  push:
    paths: ['data/clients/**', 'schema/**', 'js/library.js', 'scripts/**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/cc.mjs validate
